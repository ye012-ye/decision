server:
  port: 8080

spring:
  application:
    name: decision

  cloud:
    nacos:
      config:
        server-addr: 192.168.83.128:8848
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yaml
      discovery:
        server-addr: 192.168.83.128:8848
        namespace: dev

  # 数据源（MySQL）
  datasource:
    url: jdbc:mysql://192.168.83.128:3306/decision?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # RabbitMQ
  rabbitmq:
    host: 192.168.83.128
    port: 5672
    username: root
    password: "1234"
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 3.0
          max-interval: 30000

  # Redis（Redisson starter 也读此配置作为兜底）
  data:
    redis:
      host: 192.168.83.128
      port: 6379
      database: 0

  # SQL 初始化（生产关闭，DDL 由 Flyway/Liquibase 管理）
  sql:
    init:
      mode: never

  # Spring AI DashScope（敏感值由 Nacos 下发，此处提供默认占位）
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-0f9206e250674c538ac03de6c3aa8b64}
      chat:
        options:
          model: glm-5
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    # Milvus 现由 decision.rag.milvus.* 配置，不再使用 Spring AI 自动配置
    # MCP Client：通过 SSE 连接独立的 MCP Server
    mcp:
      client:
        enabled: true
        initialized: false
        toolcallback:
          enabled: false
        sse:
          connections:
            decision-mcp:
              url: http://localhost:8081


  # 文件上传
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Mail
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail.smtp.ssl.enable: true
# 邮件健康检查
management:
  health:
    mail:
      enabled: false

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 业务配置
decision:
  agent:
    memory-window-size: 20
    router:
      fallback-agent: chat
    model-call-limit:
      run-limit: 8
    tool-call-limit:
      run-limit: 12
    tools:
      parallel-execution: true
      max-parallel-tools: 4
      execution-timeout: 30s
      wrap-sync-tools-as-async: true
      max-retries: 1
    skills:
      mode: classpath
      classpath-path: skills
      base-path: ${java.io.tmpdir}
      auto-reload: false
      fail-fast: true
  rag:
    upload-dir: ${RAG_UPLOAD_DIR:./uploads/knowledge}
    max-file-size: ${RAG_MAX_FILE_SIZE:52428800}      # 50MB，上传层硬限制
    chunk-size: ${RAG_CHUNK_SIZE:512}                 # 每片最大 token 数
    chunk-overlap: ${RAG_CHUNK_OVERLAP:100}           # overlap token 数（约 20%）
    batch-size: ${RAG_BATCH_SIZE:100}                 # 批量写入 Milvus 的片数
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.7}  # 向量检索相似度下限
    milvus:
      uri: http://${MILVUS_HOST:192.168.83.128}:${MILVUS_PORT:19530}
      collection-name: knowledge_vectors
      dense-dimension: 1024                              # 须与 embedding model 输出维度一致
      rrf-k: 60                                          # RRF 融合参数，值越大长尾排名权重越高
  tika:
    write-limit: 10000000                                # 单文档字符上限，-1=不限
    max-embedded-resources: 200                          # 单文件最多解析的嵌入文档数
    parse-timeout: 60s                                   # 单文件解析超时
    allowed-mime-types: [ ]                              # MIME 白名单(baseType)，空=不限
    executor:                                            # 解析线程池(core 满→入队→队列满才扩到 max)
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
  external:
    weather-url: http://api.weather.example.com/current
    logistics-url: http://api.logistics.example.com/track
    exchange-rate-url: http://api.exchange.example.com/rate
  notification:
    enabled: ${NOTIFICATION_ENABLED:true}
    default-channel: EMAIL

# 日志
logging:
  level:
    com.ye.decision: DEBUG
    org.springframework.ai: INFO
    com.baomidou.mybatisplus: INFO


# kafka
  kafka:
    bootstrap-servers: localhost:9092
#    生产者
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 10
        compression.type: lz4
#     消费者
    consumer:
      group-id: order-service
      # 默认从最新偏移量开始消费
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # 允许反序列化未知字段
        spring.json.trusted.packages: "*"
        # 一次拉取最大记录数
        max.poll.records: 500
    listener:
      # 手动提交
      ack-mode: manual_immediate

# kafka 模板自定义配置（com.ye.decision.kafka 的 KafkaTemplateProperties，前缀 app.kafka）
app:
  kafka:
    topic: demo-topic
    dlt-suffix: .DLT
    consumer-group: demo-group
    concurrency: 3        # 建议 = 主题分区数
    partitions: 3         # 自动建主题用
    replicas: 1           # 单机=1；生产集群建议 >= 3
    retry:
      max-attempts: 3     # 最大重试次数（不含首次）
      backoff-ms: 1000    # 初始退避间隔
      multiplier: 2.0     # 退避倍数
      max-backoff-ms: 10000

